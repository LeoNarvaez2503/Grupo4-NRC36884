version: "3.9"

# Configuración de persistencia local contenerizada (Docker / Podman) - Grupo 04 (GR04)
# Contenedor activo: mssql-db (puerto 1433:1433, usuario sa, clave Monster9#Admin)
services:
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Monster9#Admin"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - eurekabank_mssql_data:/var/opt/mssql
      - ./eureka_bank.sql:/usr/config/eureka_bank.sql:ro

volumes:
  eurekabank_mssql_data:
