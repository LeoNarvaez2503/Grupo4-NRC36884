<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <meta charset="UTF-8"/>
    <title>Iniciar Sesión - EurekaBank Web (Jakarta Faces MVC - GR04)</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
        }
        .login-card {
            background: #ffffff;
            width: 410px;
            border-radius: 14px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }
        .login-header {
            background: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 24px 20px 18px;
            border-bottom: 3px solid #38bdf8;
        }
        .login-header h2 {
            margin: 10px 0 4px;
            color: #38bdf8;
            font-size: 20px;
            letter-spacing: 0.5px;
        }
        .login-header p {
            margin: 0;
            font-size: 12px;
            color: #94a3b8;
        }
        .login-body {
            padding: 24px 28px 28px;
        }
        .field-label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
            color: #334155;
        }
        .field-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 14px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-primary {
            flex: 2;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-secondary {
            flex: 1;
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .msg-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            padding: 10px;
            border-radius: 8px;
            list-style: none;
            margin: 0 0 14px 0;
            font-size: 13px;
        }
        .endpoint-note {
            margin-top: 16px;
            font-size: 11px;
            color: #64748b;
            text-align: center;
            word-break: break-all;
        }
    </style>
</h:head>
<h:body>
    <div class="login-card">
        <div class="login-header">
            <h:graphicImage value="/images/sullivan.png" width="96" height="96" alt="Monster Sullivan GR04" />
            <h2>EUREKABANK BANCA WEB</h2>
            <p>Grupo 04 | Dominio: ec.edu.monster | MVC Jakarta Faces</p>
        </div>
        <div class="login-body">
            <h:form id="loginForm">
                <h:messages globalOnly="true" styleClass="msg-error" />

                <h:outputLabel for="usuario" value="Usuario (Monster / cajero1..4 / gerente1):" styleClass="field-label" />
                <h:inputText id="usuario" value="#{loginView.usuario}" required="true"
                             requiredMessage="Ingrese su usuario." styleClass="field-input" />

                <h:outputLabel for="clave" value="Contraseña:" styleClass="field-label" />
                <h:inputSecret id="clave" value="#{loginView.clave}" required="true"
                               requiredMessage="Ingrese su contraseña." styleClass="field-input" />

                <h:outputLabel for="ventanilla" value="Terminal / Ventanilla:" styleClass="field-label" />
                <h:selectOneMenu id="ventanilla" value="#{loginView.ventanilla}" styleClass="field-input">
                    <f:selectItem itemValue="1" itemLabel="Ventanilla 1" />
                    <f:selectItem itemValue="2" itemLabel="Ventanilla 2" />
                    <f:selectItem itemValue="3" itemLabel="Ventanilla 3" />
                    <f:selectItem itemValue="4" itemLabel="Ventanilla 4" />
                </h:selectOneMenu>

                <div class="btn-row">
                    <h:commandButton value="Ingresar" action="#{loginView.login}" styleClass="btn-primary" />
                    <h:commandButton value="Limpiar" action="#{loginView.limpiar}" immediate="true" styleClass="btn-secondary">
                        <f:ajax execute="@this" render="loginForm" />
                    </h:commandButton>
                </div>

                <div class="endpoint-note">
                    Servidor conectado: #{loginView.controlador.endpointActual}
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
